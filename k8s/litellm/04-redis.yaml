apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-redis
  namespace: litellm
  labels:
    app: litellm-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-redis
  template:
    metadata:
      labels:
        app: litellm-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-redis
  namespace: litellm
spec:
  selector:
    app: litellm-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
